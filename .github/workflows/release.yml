name: Release

# Build installers for Linux, macOS and Windows and publish them to a GitHub
# Release. Triggered by pushing a version tag (e.g. v0.1.0), or manually.
#
# Tip: keep package.json "version" in sync with the tag you push.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # needed to create the release and upload assets

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build & publish installer
        run: npm run release
        env:
          # electron-builder publishes the release with this token.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No Apple certificate in CI. Leaving identity auto-discovery enabled
          # lets electron-builder ad-hoc sign the macOS app, which avoids the
          # "app is damaged" error on Apple Silicon (it becomes a normal
          # "unidentified developer" prompt instead).
