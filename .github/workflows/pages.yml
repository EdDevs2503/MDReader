name: Deploy GitHub Pages

# Auto-publishes the static landing page in `docs/` to GitHub Pages on every
# push to master. Requires the Pages source to be "GitHub Actions"
# (Settings → Pages → Build and deployment → Source: GitHub Actions). The
# configure-pages step below uses enablement: true to turn that on automatically
# on the first run.

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        # enablement: true switches the repo's Pages build type to "GitHub
        # Actions" automatically, so no manual Settings toggle is needed.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
