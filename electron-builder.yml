appId: com.eddevs.mdreader
productName: MDReader
# Stable, version-less artifact names so the website's
# "releases/latest/download/<file>" links always point at the newest build.
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
# Publish target for `electron-builder --publish` (used by `npm run release`
# and the Release workflow). Creates/updates a GitHub Release for the tag.
publish:
  provider: github
  owner: EdDevs2503
  repo: MDReader
  # Publish releases directly instead of leaving them as drafts.
  releaseType: release
linux:
  artifactName: ${productName}-linux.${ext}
  target:
    - AppImage
  category: Utility
mac:
  # Universal binary so the app runs on both Apple Silicon and Intel Macs.
  artifactName: ${productName}-mac.${ext}
  target:
    - target: dmg
      arch:
        - universal
  category: public.app-category.developer-tools
win:
  artifactName: ${productName}-windows.${ext}
  target:
    - nsis
